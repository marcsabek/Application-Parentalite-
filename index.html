<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

// ═══ CONSTANTS ═══
const PASS = 48060, PMSS = 4005, IJ_JOUR = 65.84, IJ_CARCDSF = 113.22, IJ_PLAFOND = 197.51;
const BRAND = {
  name: "CDS+",
  addr: "54 rue Ampère — 75017 Paris",
  email: "contact@cdservicesplus.com",
  full: "CDS+ — 54 rue Ampère, 75017 Paris",
};
const C = {
  navy:"#1a2744", coral:"#e85d4a", sage:"#7a9e7e", gold:"#d4a843",
  cream:"#faf7f2", slate:"#4a5568", slateL:"#718096", blush:"#f5e6e0",
  sky:"#dbe9f4", lav:"#e8e0f0"
};

// ═══ PDF EXPORT ═══
function exportPDF(results, params) {
  const w = window.open('', '_blank');
  if (!w) { alert("Autorisez les pop-ups pour exporter en PDF."); return; }
  const rows = results.details.map(d =>
    `<tr><td style="padding:10px 14px;border-bottom:1px solid #eee;font-size:13px">${d.label}<br><span style="color:#999;font-size:11px">${d.note}</span></td><td style="padding:10px 14px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:#e85d4a;font-size:15px;white-space:nowrap">${d.montant.toLocaleString('fr-FR',{minimumFractionDigits:2})} €</td></tr>`
  ).join('');

  const sitLabel = {maternite:"Maternité",paternite:"Paternité",adoption:"Adoption"}[params.situation];
  const statutLabel = params.statut==="titulaire"?"Titulaire":"Collaborateur libéral";
  const naissLabel = params.naissanceType==="simple"?"Naissance simple":"Naissances multiples";

  w.document.write(`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Libéral(e) & Parent — Estimation 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;color:#333;padding:40px;max-width:700px;margin:0 auto}
  @media print{body{padding:20px}@page{margin:15mm}}
</style></head><body>
<div style="display:flex;align-items:center;gap:14px;margin-bottom:8px">
  <div style="width:44px;height:44px;border-radius:12px;background:#1a2744;display:flex;align-items:center;justify-content:center;font-size:22px">👶</div>
  <div>
    <h1 style="font-family:'Playfair Display',serif;font-size:22px;color:#1a2744;margin:0">Libéral(e) & Parent</h1>
    <p style="font-size:12px;color:#999;margin:0">Estimation personnalisée — Parentalité du chirurgien-dentiste libéral — 2026</p>
  </div>
</div>
<hr style="border:none;border-top:3px solid #e85d4a;margin:16px 0 24px">

<table style="width:100%;margin-bottom:20px;font-size:13px;border-collapse:collapse">
<tr><td style="padding:6px 0;color:#718096">Situation</td><td style="padding:6px 0;font-weight:600;text-align:right">${sitLabel}</td></tr>
<tr><td style="padding:6px 0;color:#718096">Statut</td><td style="padding:6px 0;font-weight:600;text-align:right">${statutLabel}</td></tr>
<tr><td style="padding:6px 0;color:#718096">Type de naissance</td><td style="padding:6px 0;font-weight:600;text-align:right">${naissLabel}</td></tr>
<tr><td style="padding:6px 0;color:#718096">Revenu annuel moyen</td><td style="padding:6px 0;font-weight:600;text-align:right">${params.revenuMoyen.toLocaleString('fr-FR')} €</td></tr>
</table>

<h2 style="font-size:15px;color:#1a2744;margin-bottom:12px;font-family:'Playfair Display',serif">Détail des prestations</h2>
<table style="width:100%;border-collapse:collapse;margin-bottom:20px">${rows}</table>

<div style="background:#f5e6e0;border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
  <span style="font-weight:700;font-size:15px;color:#1a2744">Total estimé</span>
  <span style="font-weight:800;font-size:22px;color:#e85d4a">${results.totalEstime.toLocaleString('fr-FR',{minimumFractionDigits:2})} €</span>
</div>

<h2 style="font-size:15px;color:#1a2744;margin-bottom:12px;font-family:'Playfair Display',serif">Indemnités complémentaires (pour information)</h2>
<table style="width:100%;border-collapse:collapse;margin-bottom:24px">
<tr><td style="padding:8px 14px;background:#dbe9f4;border-radius:6px 0 0 6px;font-size:12px">IJ maladie CPAM (j4→j90)</td><td style="padding:8px 14px;background:#dbe9f4;border-radius:0 6px 6px 0;text-align:right;font-weight:700;font-size:14px">${results.ijMaladieJour.toLocaleString('fr-FR',{minimumFractionDigits:2})} €/j</td></tr>
<tr><td colspan="2" style="padding:3px"></td></tr>
<tr><td style="padding:8px 14px;background:#e8e0f0;border-radius:6px 0 0 6px;font-size:12px">IJ CARCDSF (à partir du j91)</td><td style="padding:8px 14px;background:#e8e0f0;border-radius:0 6px 6px 0;text-align:right;font-weight:700;font-size:14px">${IJ_CARCDSF} €/j</td></tr>
</table>

<div style="border-top:1px solid #eee;padding-top:16px;font-size:11px;color:#999;line-height:1.6">
  <p><strong>Sources :</strong> PMSS 2026 (arrêté du 22/12/2025). IJ CARCDSF barème 2026. LFSS 2026 art. 99 (congé supplémentaire — décrets à paraître).</p>
  <p style="margin-top:6px"><strong>${BRAND.name}</strong> — ${BRAND.email} — ${BRAND.addr}</p>
  <p style="margin-top:6px;font-style:italic">Estimation indicative générée le ${new Date().toLocaleDateString('fr-FR')}. Ne se substitue pas à un conseil personnalisé.</p>
</div>
</body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 600);
}

// ═══ UI HELPERS ═══
function FadeIn({children, delay=0}) {
  const [v,setV]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setV(true),delay);return()=>clearTimeout(t)},[delay]);
  return React.createElement('div',{style:{opacity:v?1:0,transform:v?'translateY(0)':'translateY(16px)',transition:'opacity .45s ease,transform .45s ease'}},children);
}
function Card({children,accent,style={}}) {
  return React.createElement('div',{style:{background:'#fff',borderRadius:16,padding:'24px 24px',boxShadow:'0 2px 14px rgba(26,39,68,.06)',borderLeft:accent?`4px solid ${accent}`:'none',...style}},children);
}
function Badge({children,color=C.coral}) {
  return React.createElement('span',{style:{display:'inline-block',background:color,color:'#fff',fontSize:11,fontWeight:700,letterSpacing:.5,padding:'3px 10px',borderRadius:20,textTransform:'uppercase'}},children);
}
function Sel({label,value,onChange,options}) {
  return React.createElement('div',{style:{marginBottom:16}},
    React.createElement('label',{style:{display:'block',fontSize:13,fontWeight:600,color:C.navy,marginBottom:5}},label),
    React.createElement('select',{value,onChange:e=>onChange(e.target.value),style:{width:'100%',padding:'10px 14px',borderRadius:10,border:'1.5px solid #d6d9e0',fontSize:14,color:C.navy,background:'#fff',outline:'none',cursor:'pointer'}},
      options.map(o=>React.createElement('option',{key:o.value,value:o.value},o.label))
    )
  );
}
function Num({label,value,onChange,suffix='',min=0}) {
  return React.createElement('div',{style:{marginBottom:16}},
    React.createElement('label',{style:{display:'block',fontSize:13,fontWeight:600,color:C.navy,marginBottom:5}},label),
    React.createElement('div',{style:{position:'relative'}},
      React.createElement('input',{type:'number',value,min,onChange:e=>onChange(Number(e.target.value)),style:{width:'100%',padding:'10px 14px',paddingRight:suffix?40:14,borderRadius:10,border:'1.5px solid #d6d9e0',fontSize:14,color:C.navy,background:'#fff',outline:'none',boxSizing:'border-box'}}),
      suffix&&React.createElement('span',{style:{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',fontSize:13,color:C.slateL,fontWeight:600}},suffix)
    )
  );
}

// ═══ SIMULATEUR ═══
function Simulateur() {
  const [sit,setSit]=useState('maternite');
  const [stat,setStat]=useState('titulaire');
  const [nType,setNType]=useState('simple');
  const [rev,setRev]=useState(80000);
  const [dur,setDur]=useState(16);

  const calc=()=>{
    const r={details:[],totalEstime:0,ijMaladieJour:0,ijCARCDSFJour:IJ_CARCDSF};
    if(sit==='maternite'){
      r.details.push({label:'Allocation forfaitaire de repos maternel',montant:PMSS,note:`1 PMSS = ${PMSS.toLocaleString('fr-FR')} €`});
      const sem=dur>=16?16:8,j=sem*7;
      r.details.push({label:`IJ forfaitaire de repos maternel (${sem} sem.)`,montant:j*IJ_JOUR,note:`${IJ_JOUR} €/j × ${j} j`});
      r.totalEstime=PMSS+j*IJ_JOUR;
    } else if(sit==='paternite'){
      const j=nType==='simple'?25:32;
      r.details.push({label:`IJ paternité (${j} jours)`,montant:j*IJ_JOUR,note:`${IJ_JOUR} €/j × ${j} j`});
      r.totalEstime=j*IJ_JOUR;
    } else {
      r.details.push({label:'Allocation forfaitaire (adoption)',montant:PMSS/2,note:`½ PMSS = ${(PMSS/2).toLocaleString('fr-FR')} €`});
      const j=nType==='simple'?84:273;
      r.details.push({label:`IJ adoption (${j} j max.)`,montant:j*IJ_JOUR,note:`${IJ_JOUR} €/j × ${j} j`});
      r.totalEstime=PMSS/2+j*IJ_JOUR;
    }
    r.ijMaladieJour=Math.min(Math.round(Math.min(rev,3*PASS)/730*100)/100,IJ_PLAFOND);
    return r;
  };
  const r=calc();
  const handleExport=()=>exportPDF(r,{situation:sit,statut:stat,naissanceType:nType,revenuMoyen:rev});

  return React.createElement('div',null,
    React.createElement(FadeIn,null,
      React.createElement('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:16}},
        React.createElement(Sel,{label:'Situation',value:sit,onChange:setSit,options:[{value:'maternite',label:'Maternité'},{value:'paternite',label:'Paternité'},{value:'adoption',label:'Adoption'}]}),
        React.createElement(Sel,{label:'Statut',value:stat,onChange:setStat,options:[{value:'titulaire',label:'Titulaire'},{value:'collaborateur',label:'Collaborateur libéral'}]}),
        React.createElement(Sel,{label:'Type de naissance',value:nType,onChange:setNType,options:[{value:'simple',label:'Naissance simple'},{value:'multiple',label:'Naissances multiples'}]}),
        sit==='maternite'&&React.createElement(Sel,{label:"Durée d'arrêt",value:String(dur),onChange:v=>setDur(Number(v)),options:[{value:'8',label:'8 semaines (minimum)'},{value:'16',label:'16 semaines'}]})
      )
    ),
    React.createElement(FadeIn,{delay:80},React.createElement(Num,{label:'Revenu annuel moyen (3 dernières années)',value:rev,onChange:setRev,suffix:'€'})),
    React.createElement(FadeIn,{delay:160},
      React.createElement(Card,{accent:C.coral,style:{marginBottom:18}},
        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
          React.createElement('h3',{style:{margin:0,fontSize:16,color:C.navy,fontFamily:"'Playfair Display',serif"}},'Estimation des prestations'),
          React.createElement(Badge,null,'2026')
        ),
        r.details.map((d,i)=>React.createElement('div',{key:i,style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'11px 0',borderBottom:i<r.details.length-1?'1px solid #eef0f4':'none'}},
          React.createElement('div',null,
            React.createElement('div',{style:{fontSize:14,color:C.navy,fontWeight:500}},d.label),
            React.createElement('div',{style:{fontSize:12,color:C.slateL,marginTop:2}},d.note)
          ),
          React.createElement('div',{style:{fontSize:18,fontWeight:700,color:C.coral,whiteSpace:'nowrap',marginLeft:14}},d.montant.toLocaleString('fr-FR',{minimumFractionDigits:2})+' €')
        )),
        React.createElement('div',{style:{marginTop:16,padding:'13px 16px',background:C.blush,borderRadius:12,display:'flex',justifyContent:'space-between',alignItems:'center'}},
          React.createElement('span',{style:{fontSize:15,fontWeight:700,color:C.navy}},'Total estimé'),
          React.createElement('span',{style:{fontSize:22,fontWeight:800,color:C.coral}},r.totalEstime.toLocaleString('fr-FR',{minimumFractionDigits:2})+' €')
        )
      )
    ),
    React.createElement(FadeIn,{delay:240},
      React.createElement(Card,{accent:C.sage,style:{marginBottom:18}},
        React.createElement('h4',{style:{margin:'0 0 10px',fontSize:14,color:C.sage,textTransform:'uppercase',letterSpacing:.5}},'Informations complémentaires'),
        React.createElement('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
          React.createElement('div',{style:{padding:'11px 14px',background:C.sky,borderRadius:10}},
            React.createElement('div',{style:{fontSize:11,color:C.slateL,fontWeight:600,textTransform:'uppercase',letterSpacing:.3}},'IJ maladie CPAM (j4→j90)'),
            React.createElement('div',{style:{fontSize:18,fontWeight:700,color:C.navy,marginTop:3}},r.ijMaladieJour.toLocaleString('fr-FR',{minimumFractionDigits:2})+' €/j')
          ),
          React.createElement('div',{style:{padding:'11px 14px',background:C.lav,borderRadius:10}},
            React.createElement('div',{style:{fontSize:11,color:C.slateL,fontWeight:600,textTransform:'uppercase',letterSpacing:.3}},'IJ CARCDSF (à partir du j91)'),
            React.createElement('div',{style:{fontSize:18,fontWeight:700,color:C.navy,marginTop:3}},IJ_CARCDSF+' €/j')
          )
        )
      )
    ),
    React.createElement(FadeIn,{delay:300},
      React.createElement('button',{onClick:handleExport,className:'no-print',style:{width:'100%',padding:'14px',borderRadius:12,border:'none',background:`linear-gradient(135deg,${C.coral},#d44a38)`,color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:'0 4px 16px rgba(232,93,74,.25)'}},
        '📄 Exporter en PDF'
      )
    )
  );
}

      {p:'Pendant le congé',t:'Congé d\'adoption (84 à 273 j)',d:'Durée variable selon type d\'adoption et situation familiale.',c:C.gold,i:'📅'},

        ['maternite','paternite','adoption'].map(s=>
          React.createElement('button',{key:s,onClick:()=>setSit(s),style:{flex:1,padding:'10px 12px',borderRadius:10,border:'none',background:sit===s?C.navy:'#eef0f4',color:sit===s?'#fff':C.slate,fontWeight:600,fontSize:13,cursor:'pointer',transition:'all .2s'}},
            s==='maternite'?'Maternité':s==='paternite'?'Paternité':'Adoption'
          )
        )

    ),
    React.createElement('div',{style:{position:'relative',paddingLeft:28}},

// ═══ DEMARCHES ═══

  const tog=id=>setChk(p=>({...p,[id]:!p[id]}));
  const secs=[

    ]},

    ]},
    {title:'Cessation volontaire après maternité/adoption',color:C.navy,items:[

    ))
  );
}

const tabs=[

  const [tab,setTab]=useState('simulateur');

  useEffect(()=>{
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();setDeferred(e);setPwa(true);});
  },[]);

  const installPWA=()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{setDeferred(null);setPwa(false);});}};

  const content={simulateur:Simulateur,chronologie:Chronologie,demarches:Demarches,comparatif:Comparatif,montants:Montants};
  const Comp=content[tab];

  return React.createElement('div',{style:{minHeight:'100vh',background:`linear-gradient(135deg,${C.cream} 0%,#f0eee8 100%)`}},
    // Header
    React.createElement('div',{style:{background:C.navy,padding:'26px 22px 20px',position:'relative',overflow:'hidden'}},
      React.createElement('div',{style:{position:'absolute',top:-40,right:-30,width:160,height:160,borderRadius:'50%',background:'rgba(232,93,74,.12)'}}),
      React.createElement('div',{style:{position:'relative',zIndex:1}},
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:6}},

            React.createElement('p',{style:{margin:0,fontSize:11,color:'rgba(255,255,255,.55)'}},'Maternité · Paternité · Adoption — 2026')
          ),
          pwaReady&&React.createElement('button',{onClick:installPWA,className:'no-print',style:{padding:'7px 12px',borderRadius:8,border:'1.5px solid rgba(255,255,255,.3)',background:'transparent',color:'#fff',fontSize:11,fontWeight:600,cursor:'pointer'}},'📲 Installer')
